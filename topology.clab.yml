name: noc-copilot-lab

mgmt:
  network: noc-mgmt
  ipv4-subnet: 172.20.20.0/24

topology:
  nodes:
    hub:
      kind: linux
      image: frrouting/frr:latest
      mgmt-ipv4: 172.20.20.10
      binds:
        - lab_configs/hub/daemons:/etc/frr/daemons
        - lab_configs/hub/frr.conf:/etc/frr/frr.conf

    branch1:
      kind: linux
      image: frrouting/frr:latest
      mgmt-ipv4: 172.20.20.11

    core-01:
      kind: linux
      image: frrouting/frr:latest
      mgmt-ipv4: 172.20.20.12

    fw-01:
      kind: linux
      image: frrouting/frr:latest
      mgmt-ipv4: 172.20.20.13

    rtr-01:
      kind: linux
      image: frrouting/frr:latest
      mgmt-ipv4: 172.20.20.14
      binds:
        - lab_configs/rtr-01/daemons:/etc/frr/daemons
        - lab_configs/rtr-01/frr.conf:/etc/frr/frr.conf

    branch3-uplink:
      kind: linux
      image: frrouting/frr:latest
      mgmt-ipv4: 172.20.20.15
      binds:
        - lab_configs/branch3-uplink/daemons:/etc/frr/daemons
        - lab_configs/branch3-uplink/frr.conf:/etc/frr/frr.conf

  links:
    - endpoints:
        - "hub:eth1"
        - "branch1:eth1"
    - endpoints:
        - "core-01:eth1"
        - "fw-01:eth1"
    - endpoints:
        - "fw-01:eth2"
        - "rtr-01:eth1"
    - endpoints:
        - "rtr-01:eth2"
        - "branch3-uplink:eth1"
    - endpoints:
        - "branch3-uplink:eth2"
        - "hub:eth2"
